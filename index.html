<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>좀비 키우기</title>
  <style>
    html, body { margin: 0; height: 100%; background: #8fcf7a; overflow: hidden;
      font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #game { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
    #hud { position: fixed; top: calc(env(safe-area-inset-top) + 12px); left: 12px;
      padding: 6px 12px; border-radius: 999px; background: rgba(255,250,240,0.8);
      color: #5a4a3a; font-size: 14px; font-weight: 600; pointer-events: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    #eat { position: fixed; right: calc(env(safe-area-inset-right) + 22px); bottom: calc(env(safe-area-inset-bottom) + 28px);
      width: 78px; height: 78px; border-radius: 50%; border: none;
      background: #ff8fa3; color: #fff; font-size: 20px; font-weight: 800;
      box-shadow: 0 4px 0 #e06c82, 0 6px 14px rgba(0,0,0,0.15);
      opacity: 0; transform: scale(0.6); transition: opacity .2s, transform .2s; pointer-events: none;
      touch-action: none; }
    #eat.show { opacity: 1; transform: scale(1); pointer-events: auto; }
    #bite { position: fixed; right: calc(env(safe-area-inset-right) + 112px); bottom: calc(env(safe-area-inset-bottom) + 34px);
      width: 66px; height: 66px; border-radius: 50%; border: none;
      background: #8fcf6f; color: #fff; font-size: 15px; font-weight: 800; line-height: 1.1;
      box-shadow: 0 4px 0 #64a84a, 0 6px 14px rgba(0,0,0,0.15);
      opacity: 0; transform: scale(0.6); transition: opacity .2s, transform .2s; pointer-events: none; touch-action: none; }
    #bite.show { opacity: 1; transform: scale(1); pointer-events: auto; }
    #bite.full { background: #b9c4b0; box-shadow: 0 4px 0 #8f9a86; }
    #bite:active { transform: scale(0.94); }
    /* 친구 명령: 왼쪽 위 (친구가 있을 때만) */
    #friendBar { position: fixed; top: calc(env(safe-area-inset-top) + 52px); left: 12px; display: none; gap: 8px; }
    #friendBar.show { display: flex; }
    #friendBar button { height: 36px; padding: 0 12px; border-radius: 999px; border: none;
      background: rgba(255,250,240,0.88); color: #4f7a3f; font-size: 13px; font-weight: 800;
      box-shadow: 0 2px 0 rgba(90,74,58,0.22); touch-action: none; }
    #friendBar button:active { transform: translateY(2px); box-shadow: none; }
    #panel { position: fixed; left: 12px; top: calc(env(safe-area-inset-top) + 96px); width: min(260px, calc(100vw - 100px));
      max-height: 55vh; overflow-y: auto; background: rgba(255,250,240,0.96); border-radius: 18px;
      padding: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); display: none; color: #5a4a3a; }
    #panel.show { display: block; }
    #panel h3 { margin: 2px 4px 8px; font-size: 14px; }
    #panel .row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-top: 1px solid rgba(90,74,58,0.1); font-size: 14px; }
    #panel .row span { flex: 1; }
    #panel .row button { border: none; border-radius: 999px; padding: 6px 10px; background: #ffd9e1; color: #c0506a; font-size: 12px; font-weight: 700; }
    #panel .empty { font-size: 13px; padding: 6px 4px; opacity: 0.7; }
    #eat:active { transform: scale(0.94); box-shadow: 0 2px 0 #e06c82; }
    #toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 60px);
      transform: translate(-50%, -10px); padding: 8px 16px; border-radius: 999px;
      background: rgba(90,74,58,0.85); color: #fff; font-size: 14px; white-space: nowrap;
      opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 40px);
      transform: translateX(-50%); color: rgba(90,74,58,0.85); font-size: 14px;
      background: rgba(255,250,240,0.7); padding: 6px 14px; border-radius: 999px;
      transition: opacity 1s; pointer-events: none; white-space: nowrap; }
    #hint.hide { opacity: 0; }
    #mute { position: fixed; top: calc(env(safe-area-inset-top) + 10px); right: calc(env(safe-area-inset-right) + 12px);
      width: 40px; height: 40px; border-radius: 50%; border: none; font-size: 18px;
      background: rgba(255,250,240,0.8); box-shadow: 0 2px 6px rgba(0,0,0,0.08); touch-action: none; }
    /* 지도: 오른쪽 위 작은 지도 (누르면 전체 지도) */
    #minimap { position: fixed; top: calc(env(safe-area-inset-top) + 58px); right: calc(env(safe-area-inset-right) + 12px);
      width: 84px; height: 84px; border-radius: 18px; border: 3px solid rgba(255,250,240,0.92);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); touch-action: none; background: #f6f0e2; }
    #bigmap { position: fixed; inset: 0; z-index: 50; background: rgba(60,50,40,0.45); display: none;
      align-items: center; justify-content: center; flex-direction: column; gap: 10px; touch-action: none; }
    #bigmap.show { display: flex; }
    #bigmap canvas { width: min(92vw, 78vh); height: min(92vw, 78vh); border-radius: 22px;
      border: 4px solid #fffaf0; box-shadow: 0 8px 30px rgba(0,0,0,0.3); background: #f6f0e2; }
    #bigmap .info { background: rgba(255,250,240,0.95); color: #5a4a3a; padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 700; }
    /* 동작 버튼: 오른쪽 세로 줄 (먹기 버튼 위) */
    #actions { position: fixed; right: calc(env(safe-area-inset-right) + 14px);
      bottom: calc(env(safe-area-inset-bottom) + 124px);
      display: flex; flex-direction: column; gap: 8px; }
    #actions .sep { height: 4px; }
    #actions button { width: 58px; height: 52px; border-radius: 16px; border: none;
      background: rgba(255,250,240,0.85); color: #5a4a3a;
      font-size: 20px; line-height: 1; padding: 4px 0 0;
      box-shadow: 0 2px 0 rgba(90,74,58,0.25); touch-action: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    #actions button small { font-size: 10px; font-weight: 700; }
    #actions button.on { background: #9fd18b; color: #fff; box-shadow: 0 2px 0 #6fae5c; }
    #actions button:active { transform: translateY(2px); box-shadow: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="toast"></div>
  <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
  <canvas id="minimap" aria-label="지도"></canvas>
  <div id="bigmap"><canvas></canvas><div class="info"></div></div>
  <div id="hint">화면을 끌어서 이동 · 냠! 먹기 · 물기로 친구 만들기</div>
  <div id="actions">
    <button data-action="run">🏃<small>뛰기</small></button>
    <button data-action="crawl">🐛<small>기기</small></button>
    <div class="sep"></div>
    <button data-action="sit">🪑<small>앉기</small></button>
    <button data-action="prone">🛌<small>엎드리기</small></button>
    <button data-action="lie">😴<small>눕기</small></button>
  </div>
  <div id="friendBar">
    <button id="fetchBtn">🎯 잡아와!</button>
    <button id="listBtn">👥 친구</button>
  </div>
  <div id="panel"></div>
  <button id="bite">🧟<br>물기</button>
  <button id="eat">냠!</button>
  <script type="module" src="src/main.js"></script>
</body>
</html>
